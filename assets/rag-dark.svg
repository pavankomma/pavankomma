<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="372" viewBox="0 0 1200 372" role="img" aria-label="RAG and agent pipeline: an offline ingest lane extracts, chunks and embeds documents into a vector index; the online query lane retrieves with hybrid search and reranking, generates with structured outputs and tool calls, runs guardrails and evaluations, then asks for human approval; rejected drafts loop back with feedback and confirmed answers are saved as examples.">
